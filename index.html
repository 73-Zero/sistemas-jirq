<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio de Sesión - Sistema JIRQ</title>

    <!-- Importar la fuente Roboto desde Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">

    <!-- SDKs de Firebase y lógica del sistema -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDmM8-8C3fxkPdSY3pVgudP35mVOcGdg9E",
            authDomain: "sistemas-jirq.firebaseapp.com",
            databaseURL: "https://sistemas-jirq-default-rtdb.firebaseio.com",
            projectId: "sistemas-jirq",
            storageBucket: "sistemas-jirq.firebasestorage.app",
            messagingSenderId: "556134226398",
            appId: "1:556134226398:web:f42fde5a0a9d733b7c254f",
            measurementId: "G-0XSVPF2LRH"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        let correoGlobal = "";
        let claveRealFirebase = "";
        let intentosFallidos = 0;
        let paisFirebase = "";

        // URL DE TU GOOGLE APPS SCRIPT
        const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxOaipfJ-Jfmm44xxTzJ5bR_rRpwZ8SFFucK1Pmqx3ywuXhmRi5yc32hindxhs62OpG/exec";

        window.handleLogin = async function(event) {
            event.preventDefault();
            
            const inputVal = document.getElementById('userInput').value.trim();
            const btnAction = document.getElementById('btnAction');
            const tituloHeader = document.getElementById('tituloSistema');
            const inputField = document.getElementById('userInput');
            const labelIcon = document.getElementById('inputLabelIcon');

            if (!inputVal) return;

            // FASE 1: Verificar el Correo
            if (btnAction.getAttribute('data-estado') === "ingresar_correo") {
                correoGlobal = inputVal.toLowerCase();

                try {
                    const safeEmailKey = btoa(correoGlobal).replace(/=/g, '');
                    const userRef = ref(db, 'usuarios/' + safeEmailKey);
                    const snapshot = await get(userRef);

                    if (!snapshot.exists()) {
                        intentosFallidos++;
                        if (intentosFallidos >= 3) {
                            enviarAlertaCorreo("Correo inexistente bloqueado");
                            return;
                        }
                        inputField.value = "";
                        return;
                    }

                    const userData = snapshot.val();
                    paisFirebase = userData.pais || "No registrado";

                    if (userData.estado !== 1 && userData.estado !== "activo") {
                        return;
                    }

                    // Guardamos la clave real de Firebase
                    claveRealFirebase = userData.clave;

                    // CAMBIO DE MÁSCARA: Transicionar a ingresar contraseña
                    inputField.value = "";
                    inputField.type = "password";
                    inputField.placeholder = "Ingrese su contraseña";
                    tituloHeader.textContent = "Ingrese su Contraseña";
                    btnAction.setAttribute('data-estado', "ingresar_clave");
                    
                    // Cambiar icono a candado
                    labelIcon.innerHTML = '<path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0-2-.9-2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/>';

                } catch (error) {
                    console.error("Error:", error);
                }
            } 
            // FASE 2: Verificar la Contraseña
            else if (btnAction.getAttribute('data-estado') === "ingresar_clave") {
                if (inputVal === claveRealFirebase) {
                    alert("¡Contraseña correcta! Acceso concedido al sistema principal.");
                } else {
                    intentosFallidos++;
                    if (intentosFallidos >= 3) {
                        enviarAlertaCorreo("Bloqueo por 3 intentos fallidos de contraseña");
                        return;
                    }
                    inputField.value = "";
                    inputField.focus();
                }
            }
        }

        // FUNCIÓN PARA OBTENER IP, UBICACIÓN Y ENVIAR ALERTA A GMAIL VÍA SCRIPT
        async function enviarAlertaCorreo(motivo) {
            bloquearSistema();
            
            let ipPublica = "Desconocida";
            let ciudad = "Desconocida";
            let region = "Desconocida";
            let pais = paisFirebase || "Desconocido";
            let googleMapsLink = "No disponible";
            
            try {
                const response = await fetch('https://ipapi.co/json/');
                const data = await response.json();
                
                if (data && data.ip) {
                    ipPublica = data.ip;
                    ciudad = data.city || 'Desconocida';
                    region = data.region || 'Desconocida';
                    if (data.country_name) pais = data.country_name;
                    
                    const lat = data.latitude;
                    const lon = data.longitude;
                    if (lat && lon) {
                        googleMapsLink = `https://www.google.com/maps?q=${lat},${lon}`;
                    }
                }
            } catch (e) {
                console.error("No se pudo obtener la IP:", e);
            }

            const fechaHoraActual = new Date().toLocaleString();
            
            // Paquete de datos a enviar por POST al Script de Google
            const payload = {
                correo: correoGlobal || 'No ingresado',
                motivo: motivo,
                ip: ipPublica,
                region: `${ciudad}, ${region}`,
                pais: pais,
                maps: googleMapsLink,
                fecha: fechaHoraActual
            };

            try {
                fetch(GOOGLE_SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
            } catch (err) {
                console.error("Error al enviar la alerta al servidor de Google:", err);
            }
        }

        function bloquearSistema() {
            document.body.classList.add('bloqueado-gris');
            document.documentElement.classList.add('bloqueado-gris');
            
            const loginCard = document.querySelector('.login-card');
            if (loginCard) loginCard.classList.add('tarjeta-bloqueada');
            
            const inputField = document.getElementById('userInput');
            const btnAction = document.getElementById('btnAction');
            if (inputField) {
                inputField.disabled = true;
                inputField.value = "";
            }
            if (btnAction) {
                btnAction.disabled = true;
                btnAction.style.opacity = "0.4";
                btnAction.style.cursor = "not-allowed";
            }
        }
    </script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Roboto', sans-serif;
        }

        html, body {
            height: 100vh;
            width: 100vw;
            overflow: hidden;
        }

        body {
            background: url('https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=1920&q=80') no-repeat center center fixed;
            background-size: cover;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: -webkit-filter 0.6s ease, filter 0.6s ease;
        }

        /* EFECTO VISUAL: Fondo en blanco y negro absoluto y forzado al bloquearse */
        html.bloqueado-gris, body.bloqueado-gris {
            -webkit-filter: grayscale(100%) !important;
            filter: grayscale(100%) !important;
        }

        .login-card {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 24px;
            padding: 35px 30px;
            width: 100%;
            max-width: 380px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            text-align: center;
            color: #fff;
            transition: all 0.5s ease;
        }

        /* EFECTO VISUAL: Tarjeta bloqueada */
        .login-card.tarjeta-bloqueada {
            background: rgba(20, 20, 20, 0.82) !important;
            border: 1px solid rgba(255, 50, 50, 0.5) !important;
            box-shadow: 0 8px 32px 0 rgba(255, 0, 0, 0.35) !important;
        }

        .logo-container {
            margin-bottom: 25px;
        }

        .logo-container img {
            width: 60px;
            height: 60px;
            object-fit: contain;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            padding: 5px;
            margin-bottom: 8px;
        }

        .logo-container h2 {
            font-size: 18px;
            font-weight: 500;
            letter-spacing: 0.5px;
            color: #ffffff;
        }

        .input-group {
            position: relative;
            margin-bottom: 20px;
        }

        .input-group input {
            width: 100%;
            padding: 14px 15px 14px 45px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            outline: none;
            color: #fff;
            font-size: 15px;
            transition: all 0.3s ease;
        }

        .input-group input::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }

        .input-group input:focus {
            border-color: rgba(255, 255, 255, 0.5);
            background: rgba(255, 255, 255, 0.12);
        }

        .input-group svg {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            width: 20px;
            height: 20px;
            fill: rgba(255, 255, 255, 0.6);
        }

        .btn-submit {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
            border: none;
            border-radius: 12px;
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.3s ease, transform 0.1s ease;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            margin-bottom: 20px;
        }

        .btn-submit:hover {
            opacity: 0.92;
        }

        .btn-submit:active {
            transform: scale(0.98);
        }

        .bottom-actions {
            display: flex;
            gap: 12px;
            justify-content: space-between;
        }

        .btn-secondary {
            flex: 1;
            padding: 10px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 12px;
            color: white;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: background 0.3s ease;
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.12);
        }

        .btn-secondary img {
            width: 18px;
            height: 18px;
            object-fit: contain;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="logo-container">
            <img src="https://cdn-icons-png.flaticon.com/512/6681/6681204.png" alt="Logo">
            <h2 id="tituloSistema">Sistema de Acceso</h2>
        </div>
        
        <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="input-group" id="emailGroup">
                <svg id="inputLabelIcon" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z"/></svg>
                <input type="text" id="userInput" placeholder="Ingrese su correo" required>
            </div>

            <button type="submit" class="btn-submit" id="btnAction" data-estado="ingresar_correo">
                <span>Continuar</span>
                <svg style="width:18px;height:18px;fill:#fff;" viewBox="0 0 24 24"><path d="M5 13h11.86l-5.6 5.6 1.42 1.42L21.42 12l-8.8-8-1.42 1.42L16.86 11H5z"/></svg>
            </button>
        </form>

        <div class="bottom-actions">
            <button class="btn-secondary" onclick="alert('Soporte técnico JIRQ')">
                <img src="https://cdn-icons-png.flaticon.com/512/5968/5968841.png" alt="Icono Contactar">
                <span>Contactar</span>
            </button>

            <button class="btn-secondary" onclick="window.close()">
                <img src="https://cdn-icons-png.flaticon.com/512/1828/1828427.png" alt="Icono Salir">
                <span>Salir</span>
            </button>
        </div>
    </div>

</body>
</html>
