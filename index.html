<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio de Sesión - Sistema JIRQ</title>

    <!-- Importar SDKs de Firebase mediante etiquetas script (versión compatible con GitHub Pages) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getDatabase, ref, get, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        // ==========================================
        // CONFIGURACIÓN DE FIREBASE (Tus llaves reales)
        // ==========================================
        const firebaseConfig = {
            apiKey: "TU_API_KEY_REAL",
            authDomain: "sistemas-jirq.firebaseapp.com",
            databaseURL: "https://sistemas-jirq-default-rtdb.firebaseio.com",
            projectId: "sistemas-jirq",
            storageBucket: "sistemas-jirq.appspot.com",
            messagingSenderId: "556134226398",
            appId: "TU_APP_ID_REAL"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);

        let correoGlobal = "";
        let passwordGeneradaGlobal = "";
        let intentosFallidos = 0;

        // Función principal del formulario (Cambia dinámicamente según el flujo)
        window.handleLogin = async function(event) {
            event.preventDefault();
            const inputVal = document.getElementById('userInput').value.trim();
            const btnAction = document.getElementById('btnAction');
            const tituloHeader = document.getElementById('tituloSistema');

            if (!inputVal) return;

            // PASO 1: Validación del correo ingresado
            if (btnAction.getAttribute('data-estado') === "ingresar_correo") {
                correoGlobal = inputVal;

                try {
                    // Buscar en Realtime Database (codificando el correo para que sea una ruta válida)
                    const safeEmailKey = btoa(correoGlobal).replace(/=/g, '');
                    const userRef = ref(db, 'usuarios/' + safeEmailKey);
                    const snapshot = await get(userRef);

                    if (!snapshot.exists()) {
                        intentosFallidos++;
                        if (intentosFallidos >= 3) {
                            activarBloqueoPorIP();
                            return;
                        }
                        alert(`Correo no registrado. Te quedan ${3 - intentosFallidos} intentos.`);
                        return;
                    }

                    const userData = snapshot.val();

                    // CASO A: Si el usuario ya está Activo
                    if (userData.estado === "activo") {
                        alert("Cuenta activa. (Aquí pasará a la pantalla principal en blanco próximamente).");
                    } 
                    // CASO B: Si el usuario está Pendiente (Primera vez)
                    else if (userData.estado === "pendiente" || !userData.fecha_activacion) {
                        
                        // Extraer hasta 7 letras del correo antes del "@"
                        const nombreLimpio = correoGlobal.split('@')[0].replace(/[^a-zA-Z]/g, '').substring(0, 7).toLowerCase();
                        
                        // Obtener fecha y hora actual: AñoMesDíaHoraMinuto
                        const ahora = new Date();
                        const anio = ahora.getFullYear();
                        const mes = String(ahora.getMonth() + 1).padStart(2, '0');
                        const dia = String(ahora.getDate()).padStart(2, '0');
                        const hora = String(ahora.getHours()).padStart(2, '0');
                        const minuto = String(ahora.getMinutes()).padStart(2, '0');
                        const fechaHoraStr = `${anio}${mes}${dia}${hora}${minuto}`;

                        // Simbología al azar
                        const simbolos = ['%', '$', '&', '@', '/', '+', '*'];
                        const simboloAzar = simbolos[Math.floor(Math.random() * simbolos.length)];

                        // Armar contraseña autogenerada final
                        passwordGeneradaGlobal = `${nombreLimpio}${fechaHoraStr}_${simboloAzar}`;

                        // Modificar pantalla para mostrar la contraseña autogenerada
                        tituloHeader.innerText = "Activación de Cuenta";
                        document.getElementById('inputLabelIcon').style.display = 'none'; // Ocultar icono de correo si deseas
                        const campoInput = document.getElementById('userInput');
                        campoInput.value = passwordGeneradaGlobal;
                        campoInput.readOnly = true;
                        campoInput.style.background = "rgba(255, 255, 255, 0.15)";
                        campoInput.style.fontWeight = "bold";
                        campoInput.style.textAlign = "center";

                        // Cambiar texto de ayuda o mostrar mensaje debajo
                        btnAction.setAttribute('data-estado', "copiar_y_activar");
                        btnAction.innerHTML = `<span>Copiar Contraseña</span>`;
                        btnAction.style.background = "linear-gradient(135deg, #10b981 0%, #059669 100%)";

                        // Cambiar el botón Salir por "Iniciar"
                        const btnSalir = document.getElementById('btnSalir');
                        btnSalir.innerHTML = `<span>Iniciar</span>`;
                        btnSalir.setAttribute('onclick', 'reiniciarSistema()');

                        // Mensaje de advertencia seguro
                        alert("Favor de copiarlo en una hoja es más seguro ;)");
                    }

                } catch (error) {
                    alert("Error al verificar usuario: " + error.message);
                }
            } 
            // PASO 2: Acción del botón al mostrar la contraseña generada
            else if (btnAction.getAttribute('data-estado') === "copiar_y_activar") {
                const campoInput = document.getElementById('userInput');
                campoInput.select();
                navigator.clipboard.writeText(campoInput.value);
                alert("¡Contraseña copiada al portapapeles!");

                // Proceder a registrar en Firebase Auth y actualizar Realtime Database
                try {
                    let paisDetectado = "Desconocido";
                    try {
                        const response = await fetch('https://ipapi.co/json/');
                        const data = await response.json();
                        paisDetectado = data.country_name || "Desconocido";
                    } catch (e) {
                        console.log("No se pudo detectar el país por IP");
                    }

                    // Crear credencial en Firebase Auth
                    const userCredential = await createUserWithEmailAndPassword(auth, correoGlobal, passwordGeneradaGlobal);
                    const uid = userCredential.user.uid;

                    // Actualizar nodo en Realtime Database
                    const safeEmailKey = btoa(correoGlobal).replace(/=/g, '');
                    const userRef = ref(db, 'usuarios/' + safeEmailKey);
                    await update(userRef, {
                        id: uid,
                        correo: correoGlobal,
                        contraseña: passwordGeneradaGlobal,
                        fecha_hora: new Date().toISOString(),
                        pais: paisDetectado,
                        estado: "activo"
                    });

                    alert("¡Cuenta activada con éxito!");
                    location.reload();

                } catch (error) {
                    alert("Error en la activación: " + error.message);
                }
            }
        }

        // Función de Bloqueo por exceso de intentos (Fondo en B/N, textos en rojo)
        function activarBloqueoPorIP() {
            document.body.style.filter = "grayscale(100%)";
            document.getElementById('tituloSistema').innerText = "Bloqueado";
            document.getElementById('tituloSistema').style.color = "#ef4444";
            
            const card = document.querySelector('.login-card');
            card.innerHTML = `
                <div class="logo-container">
                    <h2 id="tituloSistema" style="color: #ef4444; font-size: 22px;">Bloqueado</h2>
                </div>
                <p style="color: #ef4444; font-size: 16px; font-weight: bold; margin-bottom: 20px;">Tiempo límite</p>
                <div id="conteoRegresivo" style="font-size: 28px; font-weight: bold; color: #ef4444; margin-bottom: 25px;">03:00:00</div>
                <p style="font-size: 13px; color: rgba(255,255,255,0.7);">Acceso restringido temporalmente por seguridad de IP.</p>
            `;
            // Aquí se podría activar un temporizador de 3 horas si se desea
        }

        window.reiniciarSistema = function() {
            location.reload();
        }
    </script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: url('https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=1920&q=80') no-repeat center center fixed;
            background-size: cover;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-card {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 24px;
            padding: 35px 30px;
            width: 100%;
            max-width: 380px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            text-align: center;
            color: #fff;
        }

        .logo-container {
            margin-bottom: 25px;
        }

        .logo-container img {
            width: 60px;
            height: 60px;
            object-fit: contain;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            padding: 5px;
            margin-bottom: 8px;
        }

        .logo-container h2 {
            font-size: 18px;
            font-weight: 500;
            letter-spacing: 0.5px;
            color: #ffffff;
        }

        .input-group {
            position: relative;
            margin-bottom: 20px;
        }

        .input-group input {
            width: 100%;
            padding: 14px 15px 14px 45px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            outline: none;
            color: #fff;
            font-size: 15px;
            transition: all 0.3s ease;
        }

        .input-group input::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }

        .input-group input:focus {
            border-color: rgba(255, 255, 255, 0.5);
            background: rgba(255, 255, 255, 0.12);
        }

        .input-group svg {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            width: 20px;
            height: 20px;
            fill: rgba(255, 255, 255, 0.6);
        }

        .btn-submit {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
            border: none;
            border-radius: 12px;
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.3s ease, transform 0.1s ease;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            margin-bottom: 20px;
        }

        .btn-submit:hover {
            opacity: 0.92;
        }

        .btn-submit:active {
            transform: scale(0.98);
        }

        .bottom-actions {
            display: flex;
            gap: 12px;
            justify-content: space-between;
        }

        .btn-secondary {
            flex: 1;
            padding: 10px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 12px;
            color: white;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: background 0.3s ease;
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.12);
        }

        .btn-secondary img {
            width: 18px;
            height: 18px;
            object-fit: contain;
        }

        #contactModal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.85);
            z-index: 9999;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: #111;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 30px;
            border-radius: 20px;
            width: 90%;
            max-width: 350px;
            text-align: center;
            position: relative;
            color: #fff;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }

        .close-modal {
            position: absolute;
            top: 12px;
            right: 15px;
            background: none;
            border: none;
            color: #fff;
            font-size: 20px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="logo-container">
            <img src="https://cdn-icons-png.flaticon.com/512/6681/6681204.png" alt="Logo">
            <h2 id="tituloSistema">Sistema de Acceso</h2>
        </div>
        
        <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="input-group" id="emailGroup">
                <svg id="inputLabelIcon" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z"/></svg>
                <input type="text" id="userInput" placeholder="Ingrese su correo" required>
            </div>

            <!-- Botón con estado inicial de "ingresar_correo" -->
            <button type="submit" class="btn-submit" id="btnAction" data-estado="ingresar_correo">
                <span>Continuar</span>
                <svg style="width:18px;height:18px;fill:#fff;" viewBox="0 0 24 24"><path d="M5 13h11.86l-5.6 5.6 1.42 1.42L21.42 12l-8.8-8-1.42 1.42L16.86 11H5z"/></svg>
            </button>
        </form>

        <div class="bottom-actions">
            <button class="btn-secondary" onclick="abrirModalContactar()">
                <img src="https://cdn-icons-png.flaticon.com/512/5968/5968841.png" alt="Icono Contactar">
                <span>Contactar</span>
            </button>

            <!-- Botón Salir (cambiará a "Iniciar" cuando se genere la clave) -->
            <button class="btn-secondary" id="btnSalir" onclick="cerrarPestaña()">
                <img src="https://cdn-icons-png.flaticon.com/512/1828/1828427.png" alt="Icono Salir">
                <span>Salir</span>
            </button>
        </div>
    </div>

    <div id="contactModal">
        <div class="modal-content">
            <button class="close-modal" onclick="cerrarModalContactar()">&times;</button>
            <h3 style="margin-bottom: 15px;">Contacto</h3>
            <p style="font-size: 14px; color: #ccc;">Soporte técnico del sistema.</p>
        </div>
    </div>

    <script>
        function abrirModalContactar() {
            document.getElementById('contactModal').style.display = 'flex';
        }

        function cerrarModalContactar() {
            document.getElementById('contactModal').style.display = 'none';
        }

        function cerrarPestaña() {
            window.close();
            setTimeout(() => {
                window.location.href = "about:blank";
            }, 100);
        }
    </script>
</body>
</html>
