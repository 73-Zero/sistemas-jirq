<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio de Sesión - Sistema JIRQ</title>

    <!-- Importar la fuente Roboto desde Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">

    <!-- SDKs de Firebase y lógica del sistema -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getDatabase, ref, get, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDmM8-8C3fxkPdSY3pVgudP35mVOcGdg9E",
            authDomain: "sistemas-jirq.firebaseapp.com",
            databaseURL: "https://sistemas-jirq-default-rtdb.firebaseio.com",
            projectId: "sistemas-jirq",
            storageBucket: "sistemas-jirq.firebasestorage.app",
            messagingSenderId: "556134226398",
            appId: "1:556134226398:web:f42fde5a0a9d733b7c254f",
            measurementId: "G-0XSVPF2LRH"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);

        let correoGlobal = "";
        let passwordGeneradaGlobal = "";
        let intentosFallidos = 0;

        window.handleLogin = async function(event) {
            event.preventDefault();
            console.log("--- SE EJECUTÓ HANDLE LOGIN ---"); // Rastreo en consola
            
            const inputVal = document.getElementById('userInput').value.trim();
            const btnAction = document.getElementById('btnAction');
            const tituloHeader = document.getElementById('tituloSistema');

            if (!inputVal) return;

            if (btnAction.getAttribute('data-estado') === "ingresar_correo") {
                correoGlobal = inputVal.toLowerCase();

                try {
                    const safeEmailKey = btoa(correoGlobal).replace(/=/g, '');
                    console.log("Llave Base64 generada por JS:", safeEmailKey); // Ver qué llave busca exactamente

                    const userRef = ref(db, 'usuarios/' + safeEmailKey);
                    const snapshot = await get(userRef);

                    console.log("¿Existe el nodo en Firebase?:", snapshot.exists());

                    if (!snapshot.exists()) {
                        intentosFallidos++;
                        if (intentosFallidos >= 3) {
                            activarBloqueoPorIP();
                            return;
                        }
                        alert(`Correo no registrado. Te quedan ${3 - intentosFallidos} intentos.`);
                        return;
                    }

                    const userData = snapshot.val();
                    console.log("Datos encontrados:", userData);

                    if (userData.estado === 1 || userData.estado === "activo") {
                        alert("Cuenta activa. (Aquí pasará a la pantalla principal próximamente).");
                    } 
                    else {
                        alert("Cuenta pendiente de activación.");
                    }

                } catch (error) {
                    console.error("Error detallado:", error);
                    alert("Error al verificar usuario: " + error.message);
                }
            }
        }

        function activarBloqueoPorIP() {
            document.body.style.filter = "grayscale(100%)";
            const card = document.querySelector('.login-card');
            card.innerHTML = `
                <div class="logo-container">
                    <h2 style="color: #ef4444; font-size: 22px;">Bloqueado</h2>
                </div>
                <p style="color: #ef4444; font-size: 16px; font-weight: bold; margin-bottom: 20px;">Tiempo límite</p>
                <div style="font-size: 28px; font-weight: bold; color: #ef4444; margin-bottom: 25px;">03:00:00</div>
                <p style="font-size: 13px; color: rgba(255,255,255,0.7);">Acceso restringido temporalmente por seguridad de IP.</p>
            `;
        }

        window.reiniciarSistema = function() {
            location.reload();
        }
    </script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Roboto', sans-serif;
        }

        body {
            background: url('https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=1920&q=80') no-repeat center center fixed;
            background-size: cover;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-card {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 24px;
            padding: 35px 30px;
            width: 100%;
            max-width: 380px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            text-align: center;
            color: #fff;
        }

        .logo-container {
            margin-bottom: 25px;
        }

        .logo-container img {
            width: 60px;
            height: 60px;
            object-fit: contain;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            padding: 5px;
            margin-bottom: 8px;
        }

        .logo-container h2 {
            font-size: 18px;
            font-weight: 500;
            letter-spacing: 0.5px;
            color: #ffffff;
        }

        .input-group {
            position: relative;
            margin-bottom: 20px;
        }

        .input-group input {
            width: 100%;
            padding: 14px 15px 14px 45px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            outline: none;
            color: #fff;
            font-size: 15px;
            transition: all 0.3s ease;
        }

        .input-group input::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }

        .input-group input:focus {
            border-color: rgba(255, 255, 255, 0.5);
            background: rgba(255, 255, 255, 0.12);
        }

        .input-group svg {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            width: 20px;
            height: 20px;
            fill: rgba(255, 255, 255, 0.6);
        }

        .btn-submit {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
            border: none;
            border-radius: 12px;
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.3s ease, transform 0.1s ease;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            margin-bottom: 20px;
        }

        .btn-submit:hover {
            opacity: 0.92;
        }

        .btn-submit:active {
            transform: scale(0.98);
        }

        .bottom-actions {
            display: flex;
            gap: 12px;
            justify-content: space-between;
        }

        .btn-secondary {
            flex: 1;
            padding: 10px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 12px;
            color: white;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: background 0.3s ease;
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.12);
        }

        .btn-secondary img {
            width: 18px;
            height: 18px;
            object-fit: contain;
        }

        #contactModal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.85);
            z-index: 9999;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: #111;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 30px;
            border-radius: 20px;
            width: 90%;
            max-width: 350px;
            text-align: center;
            position: relative;
            color: #fff;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }

        .close-modal {
            position: absolute;
            top: 12px;
            right: 15px;
            background: none;
            border: none;
            color: #fff;
            font-size: 20px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="logo-container">
            <img src="https://cdn-icons-png.flaticon.com/512/6681/6681204.png" alt="Logo">
            <h2 id="tituloSistema">Sistema de Acceso</h2>
        </div>
        
        <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="input-group" id="emailGroup">
                <svg id="inputLabelIcon" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z"/></svg>
                <input type="text" id="userInput" placeholder="Ingrese su correo" required>
            </div>

            <button type="submit" class="btn-submit" id="btnAction" data-estado="ingresar_correo">
                <span>Continuar</span>
                <svg style="width:18px;height:18px;fill:#fff;" viewBox="0 0 24 24"><path d="M5 13h11.86l-5.6 5.6 1.42 1.42L21.42 12l-8.8-8-1.42 1.42L16.86 11H5z"/></svg>
            </button>
        </form>

        <div class="bottom-actions">
            <button class="btn-secondary" onclick="abrirModalContactar()">
                <img src="https://cdn-icons-png.flaticon.com/512/5968/5968841.png" alt="Icono Contactar">
                <span>Contactar</span>
            </button>

            <button class="btn-secondary" id="btnSalir" onclick="cerrarPestaña()">
                <img src="https://cdn-icons-png.flaticon.com/512/1828/1828427.png" alt="Icono Salir">
                <span>Salir</span>
            </button>
        </div>
    </div>

    <div id="contactModal">
        <div class="modal-content">
            <button class="close-modal" onclick="cerrarModalContactar()">&times;</button>
            <h3 style="margin-bottom: 15px;">Contacto</h3>
            <p style="font-size: 14px; color: #ccc;">Soporte técnico del sistema.</p>
        </div>
    </div>

    <script>
        function abrirModalContactar() {
            document.getElementById('contactModal').style.display = 'flex';
        }

        function cerrarModalContactar() {
            document.getElementById('contactModal').style.display = 'none';
        }

        function cerrarPestaña() {
            window.close();
            setTimeout(() => {
                window.location.href = "about:blank";
            }, 100);
        }
    </script>
</body>
</html>
